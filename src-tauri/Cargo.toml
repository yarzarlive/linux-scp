[package]
name = "linuxscp"
version = "0.1.0"
description = "WinSCP-inspired dual-pane file transfer client for the Linux desktop"
authors = ["LinuxSCP Contributors"]
edition = "2021"

[lib]
name = "linuxscp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.43", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
